<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-labelledby="title desc">
  <title id="title">AIC Seoul stack</title>
  <desc id="desc">Next.js App Router, React 19, Tailwind CSS, PostgreSQL with Prisma, Auth.js, Cloudinary, Resend, and Vercel.</desc>

  <rect width="1200" height="200" rx="26" fill="#0F0C0A"/>
  <rect x="0" y="0" width="1200" height="6" fill="#C7A77E"/>

  <text x="56" y="48" fill="#C7A77E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" letter-spacing="2">STACK</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#EEE9DF">
    <rect x="56" y="72" width="160" height="72" rx="14" fill="#171310" stroke="#2A2520" stroke-width="1.5"/>
    <text x="136" y="116" text-anchor="middle">Next.js 16</text>

    <rect x="236" y="72" width="148" height="72" rx="14" fill="#171310" stroke="#2A2520" stroke-width="1.5"/>
    <text x="310" y="116" text-anchor="middle">React 19</text>

    <rect x="404" y="72" width="168" height="72" rx="14" fill="#171310" stroke="#2A2520" stroke-width="1.5"/>
    <text x="488" y="116" text-anchor="middle">Postgres</text>

    <rect x="592" y="72" width="148" height="72" rx="14" fill="#171310" stroke="#2A2520" stroke-width="1.5"/>
    <text x="666" y="116" text-anchor="middle">Auth.js</text>

    <rect x="760" y="72" width="176" height="72" rx="14" fill="#171310" stroke="#2A2520" stroke-width="1.5"/>
    <text x="848" y="116" text-anchor="middle">Cloudinary</text>

    <rect x="956" y="72" width="188" height="72" rx="14" fill="#171310" stroke="#FF640D" stroke-width="1.5"/>
    <text x="1050" y="116" text-anchor="middle">Vercel</text>
  </g>
</svg>
